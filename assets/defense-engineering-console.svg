<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Bhanu Kalla security engineering dashboard hero</title>
  <desc id="desc">Dark premium terminal dashboard showing security engineering metrics, telemetry sources, and a detection pipeline.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d0e"/>
      <stop offset=".58" stop-color="#060707"/>
      <stop offset="1" stop-color="#08110e"/>
    </linearGradient>
    <linearGradient id="tealLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="redLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="titleGlow" x="-15%" y="-60%" width="130%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:Consolas,Monaco,"Courier New",monospace}
      .frame{fill:url(#panelBg);stroke:#252525;stroke-width:1.4}
      .topbar{fill:#111214}
      .card{fill:#080909;stroke:#282828;stroke-width:1.25}
      .cardHot{fill:#080b0a;stroke:#244b42;stroke-width:1.25}
      .label{fill:#8d949d;font-size:12px;letter-spacing:.9px}
      .small{fill:#8a9098;font-size:12px}
      .metric{fill:#ececec;font-size:18px;font-weight:700}
      .muted{fill:#9aa4ad}
      .dash{stroke-dasharray:8 11}
      .spark{stroke-dasharray:235;stroke-dashoffset:235}
      @keyframes dashMove{to{stroke-dashoffset:-90}}
      @keyframes spark{0%{stroke-dashoffset:235}34%,74%{stroke-dashoffset:0}100%{stroke-dashoffset:-235}}
      @keyframes glitchA{0%,62%,100%{opacity:0;transform:translate(0,0)}63%{opacity:.55;transform:translate(-5px,1px)}64%{opacity:.14;transform:translate(3px,-1px)}65%{opacity:0}}
      @keyframes glitchB{0%,43%,100%{opacity:0;transform:translate(0,0)}44%{opacity:.42;transform:translate(5px,-1px)}45%{opacity:.16;transform:translate(-4px,1px)}46%{opacity:0}}
      @keyframes flicker{0%,100%{opacity:1}6%{opacity:.55}7%{opacity:1}15%{opacity:.3}16%{opacity:1}17%{opacity:.45}18%{opacity:1}47%{opacity:.78}48%{opacity:.18}49%{opacity:1}76%{opacity:.52}77%{opacity:1}}
      @keyframes block{0%,67%,100%{opacity:0}68%{opacity:.45}69%{opacity:.08}70%{opacity:.28}71%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes ok{0%,28%,100%{opacity:0}34%,78%{opacity:1}}
      .dashRun{animation:dashMove 2.7s linear infinite}
      .spark1{animation:spark 4.2s ease-in-out infinite}
      .spark2{animation:spark 4.8s ease-in-out infinite .5s}
      .spark3{animation:spark 5.1s ease-in-out infinite 1.1s}
      .spark4{animation:spark 4.4s ease-in-out infinite 1.8s}
      .flicker{animation:flicker 7.4s steps(1) infinite}
      .ghostR{animation:glitchA 5.2s steps(1) infinite;opacity:0}
      .ghostG{animation:glitchB 6.3s steps(1) infinite;opacity:0}
      .block1{animation:block 5.4s steps(1) infinite}
      .block2{animation:block 6.2s steps(1) infinite 1.3s}
      .block3{animation:block 4.7s steps(1) infinite 2.4s}
      .blink1{animation:pulse 2.2s ease-in-out infinite}
      .blink2{animation:pulse 2.7s ease-in-out infinite .4s}
      .blink3{animation:pulse 2.1s ease-in-out infinite .9s}
      .ok{animation:ok 4.8s steps(1) infinite}
    </style>
    <path id="topFlow" d="M220 385 C270 365 300 369 334 388 L420 394 L512 394 L604 394 L696 394 L820 394"/>
    <path id="bottomFlow" d="M220 407 C270 426 300 410 334 396 L420 394 L512 394 L604 394 L696 394 L820 394"/>
  </defs>

  <rect width="1000" height="430" fill="#050505"/>
  <circle cx="500" cy="95" r="330" fill="#062018" opacity=".22"/>
  <rect x="14" y="10" width="972" height="406" rx="18" fill="#000" opacity=".62"/>
  <rect x="14" y="10" width="972" height="406" rx="18" class="frame"/>
  <path d="M14 28a18 18 0 0 1 18-18h936a18 18 0 0 1 18 18v40H14z" class="topbar"/>
  <circle cx="42" cy="39" r="6" fill="#ff5f57"/>
  <circle cx="64" cy="39" r="6" fill="#febc2e"/>
  <circle cx="86" cy="39" r="6" fill="#28c840"/>
  <text class="mono muted" x="500" y="44" text-anchor="middle" font-size="13">bhanu@defense-engineering - ~/detection-pipeline</text>

  <text class="mono muted" x="54" y="108" font-size="14">$ whoami --role</text>
  <g font-size="32" font-weight="700" class="mono">
    <text class="ghostR" x="76" y="148" fill="#fb7185">Bhanu Kalla - Security Engineer</text>
    <text class="ghostG" x="76" y="148" fill="#10d59a">Bhanu Kalla - Security Engineer</text>
    <text class="flicker" x="76" y="148" fill="#2dd4bf" filter="url(#titleGlow)">Bhanu Kalla - Security Engineer</text>
  </g>
  <rect class="block1" x="80" y="128" width="240" height="5" fill="#fb7185"/>
  <rect class="block2" x="330" y="151" width="380" height="4" fill="#2dd4bf"/>
  <rect class="block3" x="528" y="119" width="80" height="3" fill="#10d59a"/>
  <text class="mono" x="78" y="182" fill="#a7adb5" font-size="15">Detection Engineering - Telemetry Pipelines - Cloud Defense - Security Automation</text>
  <text class="mono flicker" x="690" y="106" fill="#10d59a" font-size="10">SIGMA // IAM // CLOUDTRAIL</text>
  <text class="mono flicker" x="744" y="130" fill="#fb7185" font-size="10">ERR? stale_feed=false</text>
  <text class="mono flicker" x="736" y="158" fill="#fbbf24" font-size="9">ATT&amp;CK MAP READY</text>
  <text class="mono flicker" x="760" y="210" fill="#10d59a" font-size="10">SCHEMA OK // FEEDS LIVE</text>

  <text class="mono muted" x="54" y="222" font-size="14">$ cat ./metrics.json</text>
  <g transform="translate(54,242)">
    <rect class="cardHot" width="180" height="86" rx="10"/>
    <text class="mono label" x="14" y="24">DETECTIONS</text>
    <circle class="blink1" cx="158" cy="22" r="5" fill="#10d59a" filter="url(#softGlow)"/>
    <text class="mono metric" x="14" y="52">25-35</text>
    <text class="mono small" x="14" y="70">authored / tuned</text>
    <path class="spark spark1" d="M14 76H142C152 76 154 64 166 56" stroke="url(#tealLine)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(258,242)">
    <rect class="card" width="180" height="86" rx="10"/>
    <text class="mono label" x="14" y="24">SOURCE FAMILIES</text>
    <circle class="blink2" cx="158" cy="22" r="5" fill="#fb7185" filter="url(#softGlow)"/>
    <text class="mono metric" x="14" y="52">10+</text>
    <text class="mono small" x="14" y="70">id / cloud / edr</text>
    <path class="spark spark4" d="M14 76H142C152 76 154 64 166 56" stroke="url(#redLine)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(462,242)">
    <rect class="cardHot" width="180" height="86" rx="10"/>
    <text class="mono label" x="14" y="24">INVESTIGATIONS</text>
    <circle class="blink3" cx="158" cy="22" r="5" fill="#2dd4bf" filter="url(#softGlow)"/>
    <text class="mono metric" x="14" y="52">30-45</text>
    <text class="mono small" x="14" y="70">scoped / triaged</text>
    <path class="spark spark3" d="M14 76H142C152 76 154 64 166 56" stroke="url(#tealLine)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(666,242)">
    <rect class="card" width="180" height="86" rx="10"/>
    <text class="mono label" x="14" y="24">ALERT OPS / DAY</text>
    <circle class="blink2" cx="158" cy="22" r="5" fill="#fbbf24" filter="url(#softGlow)"/>
    <text class="mono metric" x="14" y="52">80-120</text>
    <text class="mono small" x="14" y="70">alert ops tuning</text>
    <path class="spark spark2" d="M14 76H142C152 76 154 64 166 56" stroke="url(#amberLine)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <text class="mono muted" x="54" y="354" font-size="14">$ ./telemetry-defense --status</text>
  <rect x="48" y="366" width="904" height="52" rx="12" fill="#080d0b" stroke="#232b28"/>
  <g class="mono" font-size="9.5" text-anchor="middle">
    <rect x="66" y="376" width="72" height="18" rx="7" fill="#090909" stroke="#fb7185"/>
    <text x="102" y="389" fill="#c9d1d9">identity</text>
    <rect x="66" y="398" width="72" height="18" rx="7" fill="#090909" stroke="#10d59a"/>
    <text x="102" y="411" fill="#c9d1d9">cloud</text>
    <rect x="148" y="376" width="72" height="18" rx="7" fill="#090909" stroke="#2dd4bf"/>
    <text x="184" y="389" fill="#c9d1d9">endpoint</text>
    <rect x="148" y="398" width="72" height="18" rx="7" fill="#090909" stroke="#fb7185"/>
    <text x="184" y="411" fill="#c9d1d9">email/DLP</text>
  </g>
  <use href="#topFlow" class="dash dashRun" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <use href="#bottomFlow" class="dash dashRun" fill="none" stroke="#fb7185" stroke-width="2" opacity=".78"/>
  <path class="dash dashRun" d="M402 394H432M500 394H530M598 394H628M696 394H820" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <g filter="url(#softGlow)">
    <circle r="4.5" fill="#2dd4bf"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#topFlow"/></animateMotion></circle>
    <circle r="4.5" fill="#fb7185"><animateMotion dur="5s" begin="1.1s" repeatCount="indefinite"><mpath href="#bottomFlow"/></animateMotion></circle>
    <circle r="4.2" fill="#10d59a"><animateMotion dur="5s" begin="2.2s" repeatCount="indefinite"><mpath href="#topFlow"/></animateMotion></circle>
    <circle r="4.2" fill="#fbbf24"><animateMotion dur="5s" begin="3.3s" repeatCount="indefinite"><mpath href="#bottomFlow"/></animateMotion></circle>
  </g>
  <g class="mono" text-anchor="middle" font-size="10.5">
    <rect x="334" y="378" width="68" height="32" rx="9" fill="#071111" stroke="#2dd4bf" stroke-width="1.4"/>
    <text x="368" y="398" fill="#2dd4bf">validate</text>
    <rect x="432" y="378" width="68" height="32" rx="9" fill="#071111" stroke="#2dd4bf" stroke-width="1.4"/>
    <text x="466" y="398" fill="#2dd4bf">detect</text>
    <rect x="530" y="378" width="68" height="32" rx="9" fill="#130d0f" stroke="#fb7185" stroke-width="1.4"/>
    <text x="564" y="398" fill="#fb7185">enrich</text>
    <rect x="628" y="378" width="68" height="32" rx="9" fill="#071111" stroke="#2dd4bf" stroke-width="1.4"/>
    <text x="662" y="398" fill="#2dd4bf">evidence</text>
    <rect x="820" y="378" width="68" height="32" rx="9" fill="#07160f" stroke="#10d59a" stroke-width="1.4"/>
    <text x="854" y="398" fill="#10d59a">ready</text>
  </g>
  <rect x="708" y="406" width="118" height="5" rx="2.5" fill="#111"/>
  <rect x="708" y="406" width="118" height="5" rx="2.5" fill="url(#tealLine)">
    <animate attributeName="width" values="0;118;118;0" keyTimes="0;.34;.78;1" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="838" y="406" width="64" height="5" rx="2.5" fill="#111"/>
  <rect x="838" y="406" width="64" height="5" rx="2.5" fill="url(#redLine)">
    <animate attributeName="width" values="0;64;64;0" keyTimes="0;.34;.78;1" dur="5.1s" begin=".6s" repeatCount="indefinite"/>
  </rect>
  <circle class="ok" cx="916" cy="408.5" r="4" fill="#10d59a" filter="url(#softGlow)"/>
  <text class="mono ok" x="926" y="411" fill="#10d59a" font-size="9" font-weight="700">OK</text>
</svg>
