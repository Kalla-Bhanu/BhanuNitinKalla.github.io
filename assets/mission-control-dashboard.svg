<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Mission control dashboard</title>
  <desc id="desc">Dark dashboard showing security engineering focus areas, metrics, and operating lane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090909"/><stop offset="1" stop-color="#07110e"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10b981"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ef4444"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .mono{font-family:Consolas,Monaco,"Courier New",monospace}.ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .panel{fill:url(#bg);stroke:#262626;stroke-width:1.4}.card{fill:#080909;stroke:#2a2a2a;stroke-width:1.2}.hot{stroke:#24483f}
      .label{fill:#8f949c;font-size:12px;letter-spacing:.8px}.value{fill:#f2f2f2;font-size:28px;font-weight:800}.copy{fill:#9ba2aa;font-size:13px}.title{fill:#e7e7e7;font-weight:800;font-size:22px}
      .tiny{fill:#7f8790;font-size:11px}.spark{stroke-dasharray:220;stroke-dashoffset:220;animation:spark 5s ease-in-out infinite}.spark2{animation-delay:.8s}.spark3{animation-delay:1.6s}
      .pulse{animation:pulse 2.5s ease-in-out infinite}@keyframes spark{0%{stroke-dashoffset:220}35%,78%{stroke-dashoffset:0}100%{stroke-dashoffset:-220}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1000" height="330" fill="#050505"/>
  <rect x="18" y="18" width="964" height="294" rx="18" class="panel"/>
  <text class="mono label" x="48" y="58">$ ./mission-control --summary</text>
  <text class="ui title" x="48" y="91">Blue-Team Engineering Command Center</text>
  <text class="ui copy" x="48" y="116">Converting noisy security telemetry into detection logic, evidence, response paths, and automation.</text>
  <g transform="translate(48 142)">
    <rect class="card hot" width="210" height="112" rx="12"/><text class="mono label" x="18" y="29">DETECTION LANE</text><text class="ui value" x="18" y="66">25-35</text><text class="ui copy" x="18" y="88">detections authored or tuned</text><path class="spark" d="M18 98H170C184 98 188 78 198 70" stroke="url(#teal)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(278 142)">
    <rect class="card" width="210" height="112" rx="12"/><text class="mono label" x="18" y="29">TELEMETRY</text><text class="ui value" x="18" y="66">10+</text><text class="ui copy" x="18" y="88">source families validated</text><path class="spark spark2" d="M18 98H170C184 98 188 78 198 70" stroke="url(#red)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(508 142)">
    <rect class="card hot" width="210" height="112" rx="12"/><text class="mono label" x="18" y="29">INVESTIGATION</text><text class="ui value" x="18" y="66">30-45</text><text class="ui copy" x="18" y="88">cases scoped or supported</text><path class="spark spark3" d="M18 98H170C184 98 188 78 198 70" stroke="url(#teal)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(738 142)">
    <rect class="card" width="210" height="112" rx="12"/><text class="mono label" x="18" y="29">ALERT OPERATIONS</text><text class="ui value" x="18" y="66">80-120</text><text class="ui copy" x="18" y="88">daily high-volume workflows</text><path class="spark spark2" d="M18 98H170C184 98 188 78 198 70" stroke="url(#amber)" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g class="mono tiny">
    <circle class="pulse" cx="48" cy="286" r="5" fill="#10d59a" filter="url(#glow)"/><text x="62" y="290">risk scenario</text>
    <circle class="pulse" cx="186" cy="286" r="5" fill="#2dd4bf" filter="url(#glow)"/><text x="200" y="290">telemetry check</text>
    <circle class="pulse" cx="340" cy="286" r="5" fill="#fb7185" filter="url(#glow)"/><text x="354" y="290">detection logic</text>
    <circle class="pulse" cx="504" cy="286" r="5" fill="#fbbf24" filter="url(#glow)"/><text x="518" y="290">enrichment</text>
    <circle class="pulse" cx="642" cy="286" r="5" fill="#10d59a" filter="url(#glow)"/><text x="656" y="290">runbook</text>
    <circle class="pulse" cx="770" cy="286" r="5" fill="#2dd4bf" filter="url(#glow)"/><text x="784" y="290">analyst-ready evidence</text>
  </g>
</svg>
