<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Experience and education dashboard</title>
  <desc id="desc">Dark dashboard summarizing security experience, education, and current building priorities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090909"/><stop offset="1" stop-color="#07110e"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#10b981"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ef4444"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <style>
      .mono{font-family:Consolas,Monaco,"Courier New",monospace}.ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .panel{fill:url(#bg);stroke:#262626;stroke-width:1.4}.card{fill:#080909;stroke:#2a2a2a;stroke-width:1.15}.hot{stroke:#24483f}.label{fill:#8f949c;font-size:11px;letter-spacing:.8px}.name{fill:#ededed;font-size:16px;font-weight:800}.copy{fill:#9ba2aa;font-size:12.5px}.bar{stroke-width:4;stroke-linecap:round;stroke-dasharray:180;stroke-dashoffset:180;animation:draw 5s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:180}35%,78%{stroke-dashoffset:0}100%{stroke-dashoffset:-180}}
    </style>
  </defs>
  <rect width="1000" height="330" fill="#050505"/>
  <rect x="18" y="18" width="964" height="294" rx="18" class="panel"/>
  <text class="mono label" x="48" y="58">$ cat ./experience-and-education.json</text>
  <text class="ui" x="48" y="90" fill="#e7e7e7" font-size="23" font-weight="800">Professional Signal</text>
  <g transform="translate(48 122)">
    <rect class="card hot" width="286" height="104" rx="12"/><text class="mono label" x="18" y="28">SECURITY ENGINEER</text><text class="ui name" x="18" y="54">American Express</text><text class="ui copy" x="18" y="77">Detection lifecycle, telemetry, tuning.</text><path class="bar" d="M18 90H264" stroke="url(#green)"/>
  </g>
  <g transform="translate(358 122)">
    <rect class="card" width="286" height="104" rx="12"/><text class="mono label" x="18" y="28">SECURITY ANALYST</text><text class="ui name" x="18" y="54">Northeastern University</text><text class="ui copy" x="18" y="77">SIEM, phishing, endpoint, identity.</text><path class="bar" d="M18 90H264" stroke="url(#red)" style="animation-delay:.7s"/>
  </g>
  <g transform="translate(668 122)">
    <rect class="card hot" width="286" height="104" rx="12"/><text class="mono label" x="18" y="28">SECURITY ANALYST INTERN</text><text class="ui name" x="18" y="54">FILESIE</text><text class="ui copy" x="18" y="77">Alert analysis, attack paths, validation.</text><path class="bar" d="M18 90H264" stroke="url(#amber)" style="animation-delay:1.4s"/>
  </g>
  <g transform="translate(48 246)">
    <rect class="card" width="442" height="48" rx="12"/><text class="mono label" x="18" y="29">NORTHEASTERN UNIVERSITY</text><text class="ui copy" x="246" y="29">MPS InfoSec Management · 2023-2025</text>
  </g>
  <g transform="translate(510 246)">
    <rect class="card" width="442" height="48" rx="12"/><text class="mono label" x="18" y="29">GITAM UNIVERSITY</text><text class="ui copy" x="190" y="29">B.Tech Computer Science Engineering · 2019-2023</text>
  </g>
</svg>
